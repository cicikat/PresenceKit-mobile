name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    env:
      PRESENCEKIT_PROTOCOL_FIXTURES: ${{ github.workspace }}/Emerald-presence/tests/protocol_fixtures/v1
    steps:
      - uses: actions/checkout@v4
      - name: Check out canonical protocol fixtures
        uses: actions/checkout@v4
        with:
          repository: cicikat/PresenceKit
          path: Emerald-presence
      - uses: subosito/flutter-action@v2
        with:
          # Keep CI aligned with the project's Flutter 3.32 / Dart 3.8 baseline.
          # Newer stable SDKs deprecate Radio.groupValue/onChanged, while
          # RadioGroup is unavailable on this baseline.
          flutter-version: 3.32.0
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  finance-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install project NDK
        run: sdkmanager 'ndk;30.0.14904198'
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Run finance queue and Android regressions
        working-directory: android
        run: ./gradlew :app:testDevDebugUnitTest --tests com.presencekit.mobile.FinanceTest --console=plain
      - name: Upload native finance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-native-${{ github.sha }}
          path: |
            build/app/test-results/testDevDebugUnitTest/
            build/app/reports/tests/testDevDebugUnitTest/
          if-no-files-found: error
