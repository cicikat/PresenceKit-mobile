name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Keep CI aligned with the project's Flutter 3.32 / Dart 3.8 baseline.
          # Newer stable SDKs deprecate Radio.groupValue/onChanged, while
          # RadioGroup is unavailable on this baseline.
          flutter-version: 3.32.0
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
