name: android-instrumented

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          cache: true
      - run: flutter pub get
      - name: Run Android framework instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          working-directory: android
          script: |
            mkdir -p ../build/android-instrumented-diagnostics
            adb logcat -c
            set +e
            ./gradlew connectedDevDebugAndroidTest --stacktrace
            test_status=$?
            adb logcat -d -v threadtime > ../build/android-instrumented-diagnostics/logcat.txt
            adb shell dumpsys activity processes > ../build/android-instrumented-diagnostics/activity-processes.txt || true
            exit $test_status
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-${{ github.sha }}
          path: |
            build/app/outputs/androidTest-results
            build/app/reports/androidTests
            build/android-instrumented-diagnostics
          if-no-files-found: warn
          retention-days: 30
