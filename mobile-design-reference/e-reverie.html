<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>E 粉色梦核 · 在屏幕的另一边</title>
  <link rel="stylesheet" href="pink-dream.css">
  <script src="pink-dream.js" defer></script>
</head>
<body>
  <main class="dream-device">
    <div class="phone-status"><span>9:41</span><span aria-hidden="true">▂▄▆ &nbsp; ▰</span></div>
    <header class="dream-top"><a href="index.html" target="_top" aria-label="返回视觉方向对比">✧</a><div><strong>dear.you</strong><small>A SMALL WORLD BETWEEN US</small></div><span class="tiny-heart" aria-hidden="true">♥</span></header>
    <nav class="dream-tabs" aria-label="梦核页面导航">
      <button data-page="chat" aria-current="page"><span aria-hidden="true">♡</span> 私语</button>
      <button data-page="diary"><span aria-hidden="true">▤</span> 梦的碎片</button>
      <button data-page="garden"><span aria-hidden="true">✿</span> 秘密花园</button>
    </nav>
    <section id="dream-content" class="dream-content" aria-label="梦核视觉内容"></section>
    <form class="dream-compose" aria-label="模拟聊天">
      <div class="compose-caption"><span>TO : 屏幕另一边的你</span><span aria-hidden="true">♡ . ·</span></div>
      <div class="compose-line"><button type="button" id="extras" aria-label="打开附件说明">＋</button><input aria-label="输入演示消息" placeholder="把想念，偷偷打在这里…" maxlength="600" autocomplete="off"><button class="pink-send" type="submit" aria-label="模拟发送">↗</button></div>
    </form>
    <footer class="dream-footer"><span>✦ E / PINK REVERIE</span><span>视觉示范 · 非真实连接</span></footer>
    <div class="pink-toast" role="status" hidden></div>
  </main>
</body>
</html>
